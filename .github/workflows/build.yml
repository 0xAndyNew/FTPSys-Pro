name: Build & Package FtpSysPro

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore FtpSysPro.sln

    - name: Build solution (Release)
      run: dotnet build FtpSysPro.sln -c Release --no-restore

    - name: Run unit tests
      run: dotnet test tests/FtpSysPro.Core.Tests/FtpSysPro.Core.Tests.csproj -c Release --no-build --verbosity normal

    - name: Install Inno Setup
      run: choco install innosetup --no-progress

    - name: Compile Inno Setup Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\FtpSysPro.iss

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FtpSysPro_Installer
        path: dist/*.exe

    - name: Create GitHub Release on Tag
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
